name: Deploy to EasyPanel

# Dispara o webhook de implantação do EasyPanel após push em master.
# Pré-requisitos:
#   - GitHub Secret `EASYPANEL_DEPLOY_WEBHOOK` cadastrado em
#     Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret
#     (valor: a URL completa fornecida pelo EasyPanel).

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.tex'
      - '*.md'
      - 'packages/**'
      - '.vscode/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

jobs:
  test:
    name: Testes core (gate de deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (npm ci)
        run: npm ci

      # Suite Vitest (unitarios auth/chatbot + integracao supertest do apiRouter
      # em modo fallback) com cobertura >= 80%. Os specs E2E do Playwright exigem
      # GUI e rodam so na estacao Windows (Secao 2.5), fora deste gate.
      - name: npm test (vitest + cobertura)
        run: npm test

  deploy:
    name: Trigger EasyPanel webhook
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secret
        run: |
          if [ -z "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::Secret EASYPANEL_DEPLOY_WEBHOOK não está configurado."
            exit 1
          fi

      - name: POST webhook
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          # NOTA: o host administrativo do EasyPanel (vps.gmcsistemas.com.br / 187.77.47.53)
          # costuma filtrar a porta 443 por IP de origem. Os runners do GitHub Actions usam
          # faixas Azure que podem estar bloqueadas, resultando em SYN descartado (timeout
          # ~127s = tcp_syn_retries). Por isso este passo e BEST-EFFORT: falha rapido e emite
          # aviso em vez de reprovar a pipeline. O redeploy oficial e disparado da estacao
          # via `node scripts/deploy.mjs` (Secao 12.1 das instrucoes do repositorio).
          set -uo pipefail
          echo "[deploy] disparando webhook EasyPanel..."
          RC=0
          HTTP_CODE=$(curl -fsS -o /tmp/resp.txt -w '%{http_code}' \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H 'User-Agent: gha-site-acolhimento-faesa/1.0' \
            "$WEBHOOK") || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::warning title=Webhook inacessivel::curl exit ${RC}. O runner do GitHub nao alcancou o host do webhook."
            echo "::warning title=Causa provavel::Firewall da VPS descartando SYN dos IPs do GitHub Actions (timeout ~127s)."
            echo "::warning title=Acao::Dispare o redeploy da estacao com 'node scripts/deploy.mjs' e valide 'curl /version' (Secao 12.1)."
            exit 0
          fi
          echo "[deploy] HTTP $HTTP_CODE"
          if [ -s /tmp/resp.txt ]; then
            echo "[deploy] resposta:"
            head -c 1000 /tmp/resp.txt
            echo ""
          fi
