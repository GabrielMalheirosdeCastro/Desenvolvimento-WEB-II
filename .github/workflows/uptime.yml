name: Uptime monitor

# ============================================================
# D4 — Monitoramento de disponibilidade (RNF de uptime).
# ------------------------------------------------------------
# Verifica sob demanda (manual) a saude da producao batendo em /healthz e
# /version. Roda nos runners do GitHub Actions (nao na VPS) e NAO entra
# na imagem Docker (o Dockerfile so copia apps/api + apps/web/dist).
# Portanto: sem bump de versao e sem redeploy associados a este arquivo.
#
# Evidencia academica: o historico de execucoes (aba Actions) serve como
# prova de monitoramento de disponibilidade para a banca.
# ============================================================

on:
  # Disparo MANUAL apenas. O agendamento (cron */30) foi removido porque os
  # runners do GitHub Actions usam IPs Azure que a borda da VPS filtra de forma
  # intermitente -> curl rc=28 (connect timeout) gerava falso-negativo recorrente
  # mesmo com o app 100% no ar. O monitor confiavel e o cron NA VPS
  # (scripts/vps-uptime-check.sh, */5 min). Aqui fica so para verificacao sob demanda.
  workflow_dispatch: {}

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: https://acolhimento.faesa.gmcsistemas.com.br

jobs:
  healthcheck:
    name: Verifica /healthz e /version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /healthz (espera 200 e status ok)
        run: |
          set -uo pipefail
          echo "[uptime] verificando $BASE_URL/healthz ..."
          HTTP_CODE=$(curl -sS -o /tmp/healthz.txt -w '%{http_code}' \
            --connect-timeout 20 --max-time 40 \
            --retry 5 --retry-delay 10 --retry-connrefused --retry-all-errors \
            -H 'User-Agent: gha-uptime-site-acolhimento-faesa/1.0' \
            "$BASE_URL/healthz")
          RC=$?
          # rc != 0 = curl nao CONECTOU (rc=28 connect timeout / rc=7 refused etc.).
          # Isso e o filtro de IP do runner Azure pela borda da VPS — NAO indica
          # queda do app. Emite aviso e segue VERDE (inconclusivo, nao reprova).
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Runner nao conseguiu conectar a $BASE_URL/healthz (curl rc=$RC). Provavel filtragem do IP do runner GitHub Actions — NAO indica queda. Monitor confiavel = cron na VPS (scripts/vps-uptime-check.sh)."
            echo 'INCONCLUSIVO (rc='"$RC"')' > /tmp/healthz.txt
            exit 0
          fi
          echo "[uptime] HTTP $HTTP_CODE — corpo: $(cat /tmp/healthz.txt)"
          # Conectou: a partir daqui falha = QUEDA REAL (reprova vermelho).
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/healthz conectou mas retornou HTTP $HTTP_CODE (esperado 200) — possivel queda real."
            exit 1
          fi
          if ! grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/healthz.txt; then
            echo "::error::/healthz conectou mas nao retornou status ok — possivel queda real."
            exit 1
          fi

      - name: GET /version (espera 200 e campo version)
        run: |
          set -uo pipefail
          echo "[uptime] verificando $BASE_URL/version ..."
          HTTP_CODE=$(curl -sS -o /tmp/version.txt -w '%{http_code}' \
            --connect-timeout 20 --max-time 40 \
            --retry 5 --retry-delay 10 --retry-connrefused --retry-all-errors \
            -H 'User-Agent: gha-uptime-site-acolhimento-faesa/1.0' \
            "$BASE_URL/version")
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Runner nao conseguiu conectar a $BASE_URL/version (curl rc=$RC). Provavel filtragem do IP do runner GitHub Actions — NAO indica queda. Monitor confiavel = cron na VPS (scripts/vps-uptime-check.sh)."
            echo 'INCONCLUSIVO (rc='"$RC"')' > /tmp/version.txt
            exit 0
          fi
          echo "[uptime] HTTP $HTTP_CODE — corpo: $(cat /tmp/version.txt)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/version conectou mas retornou HTTP $HTTP_CODE (esperado 200) — possivel queda real."
            exit 1
          fi
          if ! grep -q '"version"' /tmp/version.txt; then
            echo "::error::/version conectou mas nao retornou o campo version — possivel queda real."
            exit 1
          fi

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Uptime check — $BASE_URL"
            echo ""
            echo "- /healthz: $(cat /tmp/healthz.txt 2>/dev/null || echo 'sem resposta')"
            echo "- /version: $(cat /tmp/version.txt 2>/dev/null || echo 'sem resposta')"
          } >> "$GITHUB_STEP_SUMMARY"
